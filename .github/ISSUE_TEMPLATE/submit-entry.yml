name: Submit a workspace, template, or example
description: Add a non-plugin entry to the SciQLop store
labels: ["submit"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Entry type
      options:
        - workspace
        - template
        - example
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "MMS Reconnection Events"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "One-line description"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      placeholder: "Your Name or Team"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated list of tags
      placeholder: "mms, reconnection, catalog"
    validations:
      required: true

  - type: input
    id: github
    attributes:
      label: GitHub repository
      description: "owner/repo (optional)"
      placeholder: "SciQLop/sciqlop-examples"

  - type: input
    id: image
    attributes:
      label: Card image URL
      description: "Optional. Absolute https URL to a landscape card thumbnail (~16:10, ~800x500, PNG/WebP/JPEG, <300 KB)."
      placeholder: "https://sciqlop.github.io/sciqlop-appstore/assets/my-plugin/card.png"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot URLs
      description: "Optional. One absolute https URL per line, up to ~5. Landscape ~16:9, <300 KB each, showing real SciQLop UI."
      placeholder: |
        https://sciqlop.github.io/sciqlop-appstore/assets/my-plugin/01.png
        https://sciqlop.github.io/sciqlop-appstore/assets/my-plugin/02.png

  - type: input
    id: url
    attributes:
      label: Download URL
      description: Direct link to the file or archive
      placeholder: "https://github.com/.../my-workspace.zip"
    validations:
      required: true
